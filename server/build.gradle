
plugins {
    id 'groovy'
    id 'application'
    id 'jacoco' // Add JaCoCo plugin for code coverage
    id 'com.gradleup.shadow' version '8.3.3'
}

//=================== Project Configuration ===================

group = 'kingsk.grails.lsp'
version = '0.5.0-SNAPSHOT'
description = 'An LSP for Groovy on Grails'

//=================== Java Configuration ===================

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
    gradlePluginPortal()
    mavenLocal()
    // Add Gradle's repository for Tooling API
    maven { url = 'https://repo.gradle.org/gradle/libs-releases' }
}

dependencies {
    // Groovy Core
    implementation "org.apache.groovy:groovy:${groovyVersion}"
    implementation "org.apache.groovy:groovy-json:${groovyVersion}"
    implementation "org.apache.groovy:groovy-yaml:${groovyVersion}"

    // Utilities // TODO: remove guava, useless, for legacy support only
    implementation "com.google.guava:guava:33.3.0-jre"
    implementation "io.github.classgraph:classgraph:${classgraphVersion}"

    // LSP4J
    implementation "org.eclipse.lsp4j:org.eclipse.lsp4j:${lsp4jVersion}"
    implementation "org.eclipse.lsp4j:org.eclipse.lsp4j.jsonrpc:${lsp4jVersion}"

    // Gradle Tooling API
    implementation "org.gradle:gradle-tooling-api:${gradleToolingApiVersion}"

    // Logging
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"
    implementation "ch.qos.logback:logback-classic:${logbackVersion}"

    // Testing
    testImplementation "org.spockframework:spock-core:${spockVersion}"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.0"
    testImplementation "org.mockito:mockito-core:${mockitoVersion}"
}

// Application Entry Point
application {
    mainClass = "kingsk.grails.lsp.GrailsLanguageServer"
}

//=================== JAR Packaging ===================

jar {
    enabled = false // Disable plain JAR, use shadowJar instead
}

tasks.named('shadowJar') {
    archiveClassifier.set('all') // Produce fat JAR with classifier
    mergeServiceFiles()          // Merge SPI service files
    // minimize()                 // Optional: shrink JAR, test carefully

    relocate "com.google.common", "kingsk.grails.lsp.shadow.guava"
    relocate "io.github.classgraph", "kingsk.grails.lsp.shadow.classgraph"
}

//============ JaCoCo Configuration ============

jacoco {
    toolVersion = "0.8.11"
}

def jacocoExcludes = [
    "**/generated/**" // Exclude generated files only
]

jacocoTestReport {
    dependsOn test  // Run after tests
    classDirectories.setFrom(
        files(sourceSets.main.output.classesDirs.files.collect { dir ->
            fileTree(dir: dir, exclude: jacocoExcludes)
        })
    )
    reports {
        xml.required = true
        html.required = true    // HTML report
        csv.required = false
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport  // verify after report
    classDirectories.setFrom(
        files(sourceSets.main.output.classesDirs.files.collect { dir ->
            fileTree(dir: dir, exclude: jacocoExcludes)
        })
    )
    violationRules {
        rule {
            element = "BUNDLE" // Apply at project level
            limit { counter = "LINE"; value = "COVEREDRATIO"; minimum = 0.60 }
            limit { counter = "BRANCH"; value = "COVEREDRATIO"; minimum = 0.50 }
        }
    }
}

test.finalizedBy jacocoTestReport   // Always generate report after tests

tasks.register('checkAll') {
    description = 'Runs all checks including tests, coverage, and verification'
    group = 'verification'
    dependsOn test, jacocoTestReport, jacocoTestCoverageVerification
}

//============ Spock Test Configuration ============

test {
    useJUnitPlatform()
    timeout = java.time.Duration.ofMinutes(10)
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat = (System.getenv('CI') ? "short" : "full")
        showStandardStreams = !System.getenv('CI')
    }
    ignoreFailures = false  // Fail the build on test failures

    // Increase heap: ClassGraph scans all system jars and exhausts default heap.
    // G1GC handles the large allocation spikes from ScanResult objects better than default.
    jvmArgs '-Xmx2g', '-Xms256m', '-XX:+UseG1GC'

    // Disable the full ClassGraph system-jar scan in test scope.
    // Production scan is triggered via GrailsCompiler.compileAndVisitAST() which is
    // not exercised in unit/service tests. Set this flag so DiscoveryService can skip
    // enableSystemJarsAndModules() when running under test.
    systemProperty 'grails.lsp.test.classgraph.disabled', 'true'

    // Set system properties for tests
    systemProperty 'grails.lsp.test.resources', layout.buildDirectory.dir("test-workspaces").get().asFile.absolutePath
    reports {
        html.required = true
        junitXml.required = true
    }
}

// Clean task enhancement
clean {
    delete layout.buildDirectory.dir("test-workspaces")
}
